name: CI

on:
  push:
    branches: [main, first-commit]
  pull_request:

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --safe --trace

      - name: Check internal links
        run: |
          bundle exec htmlproofer _site --disable-external --swap-urls '^/interactive-courses:' \
            --ignore-empty-alt --no-enforce-https

      - name: Lint content
        run: ruby scripts/lint-content.rb
