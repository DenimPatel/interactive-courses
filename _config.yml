title: Interactive Courses
description: Hand-written, interactive guides to AI, vision and math — built from scratch, one draggable picture at a time.

url: https://denimpatel.github.io
baseurl: /interactive-courses

# The github-pages gem injects jekyll-theme-primer by default; every layout
# here is local, so disable it rather than ship an unused theme stylesheet.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
