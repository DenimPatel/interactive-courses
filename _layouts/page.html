---
layout: default
---
<div class="wrap {{ page.wrap_class | default: 'wrap--narrow' }}">
  <section class="page-header">
    {% if page.kicker %}<span class="section-kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </section>
  <div class="stats-rule" style="border-top-color: var(--color-divider); margin-bottom: 8px;"></div>
  <div style="padding-top: var(--space-4);">
  {{ content }}
  </div>
</div>
