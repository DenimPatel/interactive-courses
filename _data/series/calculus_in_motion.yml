# One source of truth for the Calculus in Motion, Interactively guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html,
# and the series hub page's card grid. Part numbers live here only - page
# descriptions/titles must not restate them. The appendix sits under a separate
# `appendix:` key so the linter's part-count check sees 14 parts, not 15.
hub: /math/calculus-in-motion/
title: Calculus in Motion, Interactively
parts:
  - num: 1
    title: "Vector fields"
    short: "Part 1"
    permalink: /math/calculus-in-motion/vector-fields/
    blurb: "A particle-flow canvas you edit by hand: arrows at every point, streamlines through them, and the two numbers that describe how a field changes."
  - num: 2
    title: "Line integrals & conservative fields"
    short: "Part 2"
    permalink: /math/calculus-in-motion/line-integrals/
    blurb: "Drag a path through a field and compare the work done; when the answer depends only on the endpoints, a potential surface is hiding underneath."
  - num: 3
    title: "Divergence and curl"
    short: "Part 3"
    permalink: /math/calculus-in-motion/div-curl/
    blurb: "Drop a shrinking box probe and a paddlewheel into a field you shape, and read off outflow and rotation point by point."
  - num: 4
    title: "Green, Stokes, Divergence: one theorem"
    short: "Part 4"
    permalink: /math/calculus-in-motion/stokes/
    blurb: "Grow and shrink a region and watch the boundary total and the interior total stay equal - the Fundamental Theorem wearing three different costumes."
  - num: 5
    title: "The Jacobian determinant"
    short: "Part 5"
    permalink: /math/calculus-in-motion/change-of-variables/
    blurb: "Deform a grid and watch cell areas scale by the determinant, the factor that makes a change of variables exact."
  - num: 6
    title: "Multiple integrals & coordinates"
    short: "Part 6"
    permalink: /math/calculus-in-motion/multiple-integrals/
    blurb: "Double and triple integrals swept in polar, cylindrical and spherical coordinates, with the volume element each one brings."
  - num: 7
    title: "Lagrange multipliers & KKT"
    short: "Part 7"
    permalink: /math/calculus-in-motion/lagrange/
    blurb: "Drag a constraint against the level sets of an objective and watch tangency appear as the condition for a constrained optimum, KKT inequalities included."
  - num: 8
    title: "Matrix calculus"
    short: "Part 8"
    permalink: /math/calculus-in-motion/matrix-calculus/
    blurb: "Layout conventions, a shape checker, and the handful of matrix-derivative identities that do most of the work in machine learning."
  - num: 9
    title: "Backpropagation is the chain rule"
    short: "Part 9"
    permalink: /math/calculus-in-motion/backprop/
    blurb: "Build a small computation graph, run it forward, and watch the adjoints fill in backwards - the chain rule as an algorithm."
  - num: 10
    title: "Curvature and convergence"
    short: "Part 10"
    permalink: /math/calculus-in-motion/optimizers/
    blurb: "Race gradient descent, momentum and Adam on a surface you shape, and see how the condition number explains every zig-zag and slow crawl."
  - num: 11
    title: "Calculus of probability"
    short: "Part 11"
    permalink: /math/calculus-in-motion/probability/
    blurb: "Push a Gaussian through a map, follow how densities transform with the Jacobian, and meet reparameterisation and the KL divergence."
  - num: 12
    title: "Differential equations"
    short: "Part 12"
    permalink: /math/calculus-in-motion/odes/
    blurb: "A slope field you drop solutions into, Euler versus RK4 versus exact, and the pendulum and unicycle that turn into stability questions."
  - num: 13
    title: "Calculus on manifolds"
    short: "Part 13"
    permalink: /math/calculus-in-motion/manifolds/
    blurb: "A naive update versus an exponential-map update on a sphere, and why rotations do not add - differentiation where the space is curved."
  - num: 14
    title: "Calculus of variations & optimal control"
    short: "Part 14"
    permalink: /math/calculus-in-motion/variations/
    blurb: "Drag two endpoints and watch the minimum-jerk path re-solve itself: optimising over whole functions, and the route to trajectory optimisation."
appendix:
  - title: "Where each idea is used on this site"
    short: "Glossary"
    permalink: /math/calculus-in-motion/glossary/
    blurb: "A routing table from every idea in the volume back into the AI, vision and robotics guides that consume it."
