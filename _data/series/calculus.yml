# One source of truth for the Calculus, Interactively guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html,
# and the series hub page's card grid. Part numbers live here only - page
# descriptions/titles must not restate them. The appendix sits under a separate
# `appendix:` key so the linter's part-count check sees 14 parts, not 15.
hub: /math/calculus/
title: Calculus, Interactively
parts:
  - num: 1
    title: "Zoom in until it's a line"
    short: "Part 1"
    permalink: /math/calculus/local-linearity/
    blurb: "The whole subject in one idea: almost every function is locally linear, and a derivative is just the slope you find when you zoom in far enough."
  - num: 2
    title: "Limits, made concrete"
    short: "Part 2"
    permalink: /math/calculus/limits/
    blurb: "The epsilon-delta definition as a two-slider game, one-sided limits, and the exact places a function can fail to be continuous."
  - num: 3
    title: "The derivative"
    short: "Part 3"
    permalink: /math/calculus/derivative/
    blurb: "A secant line sliding into a tangent: drag the point and watch the derivative trace itself out, then see why the slope is the best linear approximation."
  - num: 4
    title: "A toolbox of derivatives"
    short: "Part 4"
    permalink: /math/calculus/rules/
    blurb: "Product, quotient and chain rules built as pictures - the product rule as the area of a growing rectangle - plus the derivatives worth memorising."
  - num: 5
    title: "The chain rule"
    short: "Part 5"
    permalink: /math/calculus/chain-rule/
    blurb: "Composed machines with rate gauges: multiply the gear ratios and the chain rule falls out, the same rule backprop runs in reverse."
  - num: 6
    title: "Implicit differentiation & related rates"
    short: "Part 6"
    permalink: /math/calculus/implicit/
    blurb: "Differentiate an equation you cannot solve for y by dragging along the curve it defines, and connect rates that are tied together by a constraint."
  - num: 7
    title: "Linear approximation, Newton, Taylor"
    short: "Part 7"
    permalink: /math/calculus/taylor/
    blurb: "Add terms one at a time and watch a polynomial wrap a curve, then use the first-order model to run Newton's method and map its basins of attraction."
  - num: 8
    title: "The integral as accumulation"
    short: "Part 8"
    permalink: /math/calculus/integral/
    blurb: "A Riemann-sum slider that shrinks rectangles into signed area, with left, right, midpoint and trapezoid rules side by side."
  - num: 9
    title: "The Fundamental Theorem"
    short: "Part 9"
    permalink: /math/calculus/ftc/
    blurb: "Area-so-far traced live beside the curve: differentiation and integration are inverse operations, and the odometer makes the theorem an observation."
  - num: 10
    title: "Substitution, parts, and going numeric"
    short: "Part 10"
    permalink: /math/calculus/integration-techniques/
    blurb: "Substitution as the chain rule backwards, integration by parts as the product rule backwards, and when to give up on closed forms and use quadrature."
  - num: 11
    title: "Functions of several variables"
    short: "Part 11"
    permalink: /math/calculus/multivariable/
    blurb: "A surface with draggable slice planes: hold one input fixed and single-variable calculus returns as a partial derivative."
  - num: 12
    title: "The gradient"
    short: "Part 12"
    permalink: /math/calculus/gradient/
    blurb: "A contour map, a directional-derivative dial, and the reason the gradient points uphill and meets every level set at a right angle."
  - num: 13
    title: "The derivative as a matrix"
    short: "Part 13"
    permalink: /math/calculus/jacobian-hessian/
    blurb: "The arm Jacobian, a quadratic-form explorer, and Hessian eigenvalues that sort every critical point into bowl, ridge or saddle."
  - num: 14
    title: "Multivariable Taylor & critical points"
    short: "Part 14"
    permalink: /math/calculus/multivariable-taylor/
    blurb: "The local quadratic model on a surface, the second-derivative test in matrix form, and the shape of the landscape a solver has to descend."
appendix:
  - title: "Notation & identities to know"
    short: "Glossary"
    permalink: /math/calculus/glossary/
    blurb: "Every notation and identity used across the volume, collected in one place with a pointer back to the part that derives it."
