# One source of truth for the Probability in Action, Interactively guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The optional `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these ids.
# `appendix:` (spelled `appendix:` below, matching the other series) holds the
# routing table so the linter's part-count check sees 20 parts, not 21.
hub: /math/probability-in-action/
title: Probability in Action, Interactively
acts:
  - id: learning
    label: "I · Learning from data"
  - id: computing
    label: "II · Computing with probability"
  - id: information
    label: "III · Information and structure"
  - id: world
    label: "IV · Estimation in the world"
parts:
  - num: 1
    act: learning
    title: "Likelihood and maximum likelihood"
    short: "Part 1"
    permalink: /math/probability-in-action/likelihood/
    blurb: "Drag the parameter and watch the log-likelihood surface move with the fitted curve — and see why a likelihood is not a probability over θ."
  - num: 2
    act: learning
    title: "Prior, posterior, conjugacy"
    short: "Part 2"
    permalink: /math/probability-in-action/bayesian-inference/
    blurb: "Shape a Beta prior by hand, stream in data a point at a time, and watch the posterior concentrate."
  - num: 3
    act: learning
    title: "Is this estimator any good?"
    short: "Part 3"
    permalink: /math/probability-in-action/estimators/
    blurb: "Sampling distributions, the bias–variance trade-off on a dartboard, Fisher information, and the Cramér–Rao floor."
  - num: 4
    act: learning
    title: "Confidence vs credible"
    short: "Part 4"
    permalink: /math/probability-in-action/intervals/
    blurb: "A hundred simulated intervals with about ninety-five covering the truth, beside the posterior interval on the same data."
  - num: 5
    act: learning
    title: "Hypothesis testing, and how it goes wrong"
    short: "Part 5"
    permalink: /math/probability-in-action/testing/
    blurb: "Null against alternative with a draggable effect size: α, β and power, the p-value under H₀, and p-hacking made visible."
  - num: 6
    act: learning
    title: "The bootstrap"
    short: "Part 6"
    permalink: /math/probability-in-action/bootstrap/
    blurb: "Resample with replacement and build a sampling distribution from one dataset — and see where the method breaks."
  - num: 7
    act: computing
    title: "How to draw a sample"
    short: "Part 7"
    permalink: /math/probability-in-action/sampling/
    blurb: "Inverse-CDF, rejection sampling with a draggable envelope, and importance sampling with its weight histogram."
  - num: 8
    act: computing
    title: "Monte Carlo integration"
    short: "Part 8"
    permalink: /math/probability-in-action/monte-carlo/
    blurb: "π by darts with its 1/√N error band, then antithetic variates, control variates and stratification raced on one plot."
  - num: 9
    act: computing
    title: "Random walks, Poisson processes, Brownian motion"
    short: "Part 9"
    permalink: /math/probability-in-action/random-walks/
    blurb: "Walks in one and two dimensions, √n scaling, exponential gaps, the Brownian limit, and a martingale with optional stopping."
  - num: 10
    act: computing
    title: "Markov chains"
    short: "Part 10"
    permalink: /math/probability-in-action/markov-chains/
    blurb: "Edit a transition matrix, watch a token hop between states, and see the stationary distribution appear — then rank the web."
  - num: 11
    act: computing
    title: "MCMC"
    short: "Part 11"
    permalink: /math/probability-in-action/mcmc/
    blurb: "Metropolis–Hastings on a 2D posterior, the step size that helps and then hurts, Gibbs' axis-aligned moves, and HMC for contrast."
  - num: 12
    act: computing
    title: "Latent variables: EM and the ELBO"
    short: "Part 12"
    permalink: /math/probability-in-action/latent-variables/
    blurb: "Fit a Gaussian mixture step by step, with responsibilities as colour and the ELBO as a lower bound you can watch tighten."
  - num: 13
    act: information
    title: "Entropy, cross-entropy, KL, mutual information"
    short: "Part 13"
    permalink: /math/probability-in-action/information/
    blurb: "Shape a distribution and watch entropy fall, read KL as a codelength excess, and see mode-seeking against mode-covering fits."
  - num: 14
    act: information
    title: "Bayes nets and factor graphs"
    short: "Part 14"
    permalink: /math/probability-in-action/graphical-models/
    blurb: "A clickable DAG with d-separation highlighted, explaining-away done numerically, and the same model drawn as a factor graph."
  - num: 15
    act: information
    title: "Hidden Markov models"
    short: "Part 15"
    permalink: /math/probability-in-action/hmm/
    blurb: "Forward–backward fills a trellis cell by cell and Viterbi's backtrace lights up, on a robot lost in a corridor."
  - num: 16
    act: world
    title: "The Bayes filter"
    short: "Part 16"
    permalink: /math/probability-in-action/bayes-filter/
    blurb: "A histogram filter on a looped corridor: predict is convolve and blur, update is multiply and sharpen — the loop everything else specialises."
  - num: 17
    act: world
    title: "The Kalman filter and EKF"
    short: "Part 17"
    permalink: /math/probability-in-action/kalman/
    blurb: "The same recursion with Gaussians: a tunable tracker, then a 2D EKF whose linearisation error you can watch grow."
  - num: 18
    act: world
    title: "Particle filters"
    short: "Part 18"
    permalink: /math/probability-in-action/particle-filter/
    blurb: "Monte Carlo localization in a 2D map — sample, weight, resample — with particle depletion shown and then fixed."
  - num: 19
    act: world
    title: "Outliers, RANSAC and robust estimation"
    short: "Part 19"
    permalink: /math/probability-in-action/robust/
    blurb: "Heavy-tailed noise breaking least squares, RANSAC's inlier search, and the Huber and Cauchy loss curves that repair it."
  - num: 20
    act: world
    title: "Probability in machine learning"
    short: "Part 20"
    permalink: /math/probability-in-action/probabilistic-ml/
    blurb: "Softmax as a distribution with a temperature dial, cross-entropy as negative log-likelihood, calibration, a GP posterior, VAEs and diffusion."
appendix:
  - title: "Where each idea is used on this site"
    short: "Glossary"
    permalink: /math/probability-in-action/glossary/
    blurb: "A routing table from every idea in the volume back into the AI, vision and robotics guides that consume it."