# One source of truth for the Generative Media guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these
# ids, added by hand because scripts/new-part.sh does not emit it.
# `appendix:` holds the glossary so the linter's part-count check sees the real
# part count, not part count + 1 (an appendix is a reference card, not a part).
hub: /ai/generative-media/
title: Generative Media, Interactively
acts:
  - id: noise
    label: "I · From noise to images"
  - id: stack
    label: "II · The modern stack"
  - id: control
    label: "III · Control and speed"
  - id: video
    label: "IV · Video"
  - id: sound
    label: "V · Sound"
  - id: ship
    label: "VI · Judging and shipping"
parts:
  - num: 1
    act: noise
    title: "What a generative model actually is"
    short: "Part 1"
    permalink: /ai/generative-media/what-generative-means/
    blurb: "Sampling from a distribution you never see: a 2D dataset you draw yourself, and the line between memorising it and modelling it."
  - num: 2
    act: noise
    title: "Destroying an image with noise"
    short: "Part 2"
    permalink: /ai/generative-media/forward-process/
    blurb: "The forward process on a procedurally-generated image, q(x_t|x_0) in closed form, and what ᾱ, SNR and the schedule choice actually do."
  - num: 3
    act: noise
    title: "Learning to undo one step"
    short: "Part 3"
    permalink: /ai/generative-media/denoiser/
    blurb: "ε-, x₀- and v-prediction, and a real tiny denoiser trained in the browser with its loss curve live."
  - num: 4
    act: noise
    title: "Sampling: noise to picture"
    short: "Part 4"
    permalink: /ai/generative-media/sampling/
    blurb: "The reverse loop from noise to sample; ancestral DDPM against deterministic DDIM, and a step-count slider that shows the trade."
  - num: 5
    act: noise
    title: "The score function"
    short: "Part 5"
    permalink: /ai/generative-media/score-and-sdes/
    blurb: "The score field as arrows over a density, Langevin dynamics, the SMLD to DDPM equivalence and the VE versus VP SDEs."
  - num: 6
    act: stack
    title: "Flow matching and rectified flow"
    short: "Part 6"
    permalink: /ai/generative-media/flow-matching/
    blurb: "Curved paths against straight ones, the velocity-field view of an ODE, and why the frontier trainers made flow matching the default."
  - num: 7
    act: stack
    title: "Latent diffusion"
    short: "Part 7"
    permalink: /ai/generative-media/latent-diffusion/
    blurb: "The VAE compressor that shrinks an image before it is diffused, the cost of an eight-times downsample, and the pixel versus latent budget."
  - num: 8
    act: stack
    title: "The U-Net backbone"
    short: "Part 8"
    permalink: /ai/generative-media/unet/
    blurb: "The resolution pyramid and its skips, residual blocks, where self- and cross-attention sit, and interactive parameter counts."
  - num: 9
    act: stack
    title: "The DiT backbone"
    short: "Part 9"
    permalink: /ai/generative-media/dit/
    blurb: "Patching a latent into tokens, plain transformer blocks with adaLN-Zero conditioning, and U-Net against DiT."
  - num: 10
    act: stack
    title: "Conditioning and classifier-free guidance"
    short: "Part 10"
    permalink: /ai/generative-media/guidance/
    blurb: "Text encoders and cross- against joint attention, CFG as extrapolation, and what guidance scale costs in diversity."
  - num: 11
    act: control
    title: "Samplers and schedulers"
    short: "Part 11"
    permalink: /ai/generative-media/samplers/
    blurb: "Euler, Heun and multistep solvers against the ancestral sampler, timestep spacing as a design choice, and step budget against error."
  - num: 12
    act: control
    title: "Few-step generation"
    short: "Part 12"
    permalink: /ai/generative-media/distillation/
    blurb: "Progressive, consistency, adversarial and shortcut distillation, and what collapsing fifty steps into one or four costs in diversity."
  - num: 13
    act: control
    title: "Steering a frozen model"
    short: "Part 13"
    permalink: /ai/generative-media/control/
    blurb: "LoRA and DreamBooth, ControlNet and IP-Adapter, inpainting and SDEdit editing, and where along the trajectory each intervention bites."
  - num: 14
    act: video
    title: "Video as a 3D signal"
    short: "Part 14"
    permalink: /ai/generative-media/video-basics/
    blurb: "The causal 3-D VAE, spatiotemporal patches, 3-D against factorised attention, and the token budget a clip really costs."
  - num: 15
    act: video
    title: "Coherent and long"
    short: "Part 15"
    permalink: /ai/generative-media/video-coherence/
    blurb: "Image and keyframe conditioning, temporal cascades, autoregressive rollout against full-sequence diffusion, drift, and the world-model claim."
  - num: 16
    act: sound
    title: "What audio is, numerically"
    short: "Part 16"
    permalink: /ai/generative-media/audio-basics/
    blurb: "A waveform, its sample rate, the STFT and the mel scale, and the token-rate arithmetic that makes raw waveform generation hopeless."
  - num: 17
    act: sound
    title: "Neural audio codecs"
    short: "Part 17"
    permalink: /ai/generative-media/audio-codecs/
    blurb: "The encoder, residual vector quantiser and decoder that turn sound into a few hundred discrete tokens a second."
  - num: 18
    act: sound
    title: "Text to speech"
    short: "Part 18"
    permalink: /ai/generative-media/tts/
    blurb: "From alignment and duration models to codec language models and two-stage synthesis, with cloning and streaming first-chunk latency."
  - num: 19
    act: sound
    title: "Speech to text, and answering out loud"
    short: "Part 19"
    permalink: /ai/generative-media/asr-and-duplex/
    blurb: "CTC, RNN-T and Whisper, why streaming is hard and the two-pass fix, then voice activity, barge-in and the realtime duplex budget."
  - num: 20
    act: ship
    title: "Evaluating and shipping"
    short: "Part 20"
    permalink: /ai/generative-media/evaluation-and-provenance/
    blurb: "FID, FVD and CLIPScore and what each misses, preference models and Elo arenas, memorisation, and provenance under the EU AI Act."
appendix:
  - title: "Glossary & numbers to know"
    short: "Reference"
    permalink: /ai/generative-media/glossary/
    blurb: "Every term linked back to the part that introduces it, plus the model, sampler and formula tables."
