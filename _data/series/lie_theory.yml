# One source of truth for the Lie Groups & Lie Algebras guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html and the series
# hub's card grid. Part numbers live here only - page descriptions/titles must not
# restate them. The formula sheet sits under `appendix:` so the linter's part-count
# check sees 12 parts, not 13. Every page computes with assets/js/lie-viz.js
# (window.Lie), whose numerics are asserted by scripts/check-lie-viz.js.
hub: /vision/lie-theory/
title: Lie Groups & Lie Algebras, Interactively
acts:
  - id: groups
    label: "I · Groups you can see"
  - id: algebra
    label: "II · The algebra"
  - id: rigid
    label: "III · Rigid motion"
  - id: calculus
    label: "IV · Calculus on groups"
parts:
  - num: 1
    act: groups
    title: "Why rotations don't add"
    short: "Part 1"
    permalink: /vision/lie-theory/why-lie-groups/
    blurb: "Average two compass headings, add two sets of Euler angles, sum two rotation matrices - and watch each one fail in a way that points at the same missing idea."
  - num: 2
    act: groups
    title: "Groups, matrix groups and manifolds"
    short: "Part 2"
    permalink: /vision/lie-theory/groups-and-manifolds/
    blurb: "The four group axioms tested live on SO(2), SO(3), SE(3) and friends, and the smooth, locally flat surface that turns a group into a Lie group."
  - num: 3
    act: groups
    title: "SO(2): the whole story in one dimension"
    short: "Part 3"
    permalink: /vision/lie-theory/so2-circle/
    blurb: "The circle, its tangent line, exp as wrapping and log as unwrapping, and the plus and minus operators every later part generalises."
  - num: 4
    act: algebra
    title: "The tangent space and so(3)"
    short: "Part 4"
    permalink: /vision/lie-theory/so3-algebra/
    blurb: "Differentiate R(t)R(t)ᵀ = I and a skew-symmetric matrix falls out: hat and vee, the three generators, and the Lie bracket as the cost of reordering two rotations."
  - num: 5
    act: algebra
    title: "Exp and Log on SO(3)"
    short: "Part 5"
    permalink: /vision/lie-theory/exp-log-so3/
    blurb: "Rodrigues' formula two ways, the Log map and its two numerical traps, and the ball of radius π that holds every rotation exactly once."
  - num: 6
    act: algebra
    title: "Euler angles, axis-angle and quaternions"
    short: "Part 6"
    permalink: /vision/lie-theory/parametrizations/
    blurb: "Drive a gimbal into lock, watch a quaternion take 720° to come home, and compare every way of writing a rotation down."
  - num: 7
    act: rigid
    title: "SE(2) and SE(3): rigid motion"
    short: "Part 7"
    permalink: /vision/lie-theory/se3-rigid-motion/
    blurb: "Homogeneous matrices, twists, and why the exponential of a constant velocity is a screw - a helix you can shape with two sliders."
  - num: 8
    act: rigid
    title: "The adjoint: moving tangent vectors between frames"
    short: "Part 8"
    permalink: /vision/lie-theory/adjoint/
    blurb: "One perturbation, applied on the left or on the right of a pose, and the matrix that converts between them - plus what each library means by a 'delta'."
  - num: 9
    act: calculus
    title: "Jacobians on Lie groups"
    short: "Part 9"
    permalink: /vision/lie-theory/jacobians/
    blurb: "Right and left Jacobians, Baker-Campbell-Hausdorff to first order, and a table of elementary derivatives you can check numerically with one click."
  - num: 10
    act: calculus
    title: "Optimization on manifolds"
    short: "Part 10"
    permalink: /vision/lie-theory/optimization-on-groups/
    blurb: "Gauss-Newton with a retraction: align two point clouds on SE(3), average noisy rotations, and close the loop on a small SE(2) pose graph."
  - num: 11
    act: calculus
    title: "Uncertainty on Lie groups"
    short: "Part 11"
    permalink: /vision/lie-theory/uncertainty/
    blurb: "Gaussians that live in the tangent space, the banana-shaped cloud of a robot driving with a shaky heading, and covariance propagated through composition."
  - num: 12
    act: calculus
    title: "Interpolation, integration and IMU preintegration"
    short: "Part 12"
    permalink: /vision/lie-theory/interpolation-and-dynamics/
    blurb: "Geodesics and slerp, integrating an angular velocity without drifting off the group, and the preintegrated gyro measurement that makes visual-inertial odometry fast."
appendix:
  - title: "Lie theory formula sheet"
    short: "Formula sheet"
    permalink: /vision/lie-theory/cheat-sheet/
    blurb: "Hat, vee, Exp, Log, adjoint and both Jacobians for SO(2), SO(3), SE(2) and SE(3) on one page, with the conventions used by the major libraries."
