# One source of truth for the Linear Algebra guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The optional `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these ids.
# `appendix:` (spelled `appendix:` below, matching the other series) holds the
# reference card so the linter's part-count check sees 22 parts, not 23.
hub: /math/linear-algebra/
title: Linear Algebra, Interactively
acts:
  - id: foundations
    label: "I · Foundations"
  - id: inner
    label: "II · Inner products"
  - id: eigen
    label: "III · Eigen & SVD"
  - id: applied
    label: "IV · Applied"
parts:
  - num: 1
    act: foundations
    title: "What a vector is (three answers)"
    short: "Part 1"
    permalink: /math/linear-algebra/vectors/
    blurb: "An arrow, a list of numbers, and an abstract object you can add and scale — and why they are the same thing."
  - num: 2
    act: foundations
    title: "Span, independence and basis"
    short: "Part 2"
    permalink: /math/linear-algebra/span-basis/
    blurb: "When two vectors reach the whole plane, when they collapse to a line, and what a basis is for."
  - num: 3
    act: foundations
    title: "Linear transformations are matrices"
    short: "Part 3"
    permalink: /math/linear-algebra/transformations/
    blurb: "The one idea that makes matrices inevitable: a linear map is determined by where it sends the basis vectors."
  - num: 4
    act: foundations
    title: "Matrix multiplication is composition"
    short: "Part 4"
    permalink: /math/linear-algebra/composition/
    blurb: "Applying one transformation after another is a matrix product — which is why AB is not BA."
  - num: 5
    act: foundations
    title: "The determinant: signed area"
    short: "Part 5"
    permalink: /math/linear-algebra/determinant/
    blurb: "The signed area of the unit square after a transformation, and why det = 0 means information is destroyed."
  - num: 6
    act: foundations
    title: "Solving Ax = b, and Gaussian elimination"
    short: "Part 6"
    permalink: /math/linear-algebra/systems/
    blurb: "Elimination as a sequence of row operations, and the geometric picture of three planes that meet at a point, a line, or nowhere."
  - num: 7
    act: foundations
    title: "Rank, null space, and the four subspaces"
    short: "Part 7"
    permalink: /math/linear-algebra/rank-subspaces/
    blurb: "Column space, null space, row space and left null space — the four subspaces that rank ties together."
  - num: 8
    act: inner
    title: "Dot product, projection, duality"
    short: "Part 8"
    permalink: /math/linear-algebra/dot-product/
    blurb: "Projection, cosine similarity, and the duality that a 1×n matrix is really a vector in disguise."
  - num: 9
    act: inner
    title: "Orthonormal bases and Gram–Schmidt"
    short: "Part 9"
    permalink: /math/linear-algebra/orthogonality/
    blurb: "Turning any set of vectors into a perpendicular one, and why QR is what you actually compute."
  - num: 10
    act: inner
    title: "Least squares is a projection"
    short: "Part 10"
    permalink: /math/linear-algebra/least-squares/
    blurb: "When Ax = b has no solution, the best you can do is project b onto the column space."
  - num: 11
    act: inner
    title: "Cross product and skew-symmetric matrices"
    short: "Part 11"
    permalink: /math/linear-algebra/cross-product/
    blurb: "The area of a parallelogram, the normal to a plane, and the matrix form of the cross product."
  - num: 12
    act: eigen
    title: "Same map, different coordinates"
    short: "Part 12"
    permalink: /math/linear-algebra/change-of-basis/
    blurb: "The same linear map looks different in every basis; P⁻¹AP is the change of costume."
  - num: 13
    act: eigen
    title: "The arrows that don't turn"
    short: "Part 13"
    permalink: /math/linear-algebra/eigenvectors/
    blurb: "Sweep a vector around a circle: almost all of them turn, except the special directions that only stretch."
  - num: 14
    act: eigen
    title: "Matrix powers and dynamical systems"
    short: "Part 14"
    permalink: /math/linear-algebra/diagonalization/
    blurb: "Iterating x ← Ax, and why the eigenvalue magnitude decides whether a system settles, cycles or explodes."
  - num: 15
    act: eigen
    title: "Symmetric matrices and quadratic forms"
    short: "Part 15"
    permalink: /math/linear-algebra/symmetric/
    blurb: "Matrices you can rotate to face you: real eigenvalues, orthogonal eigenvectors, and xᵀAx as a shape."
  - num: 16
    act: eigen
    title: "Every matrix maps a circle to an ellipse"
    short: "Part 16"
    permalink: /math/linear-algebra/svd/
    blurb: "Every matrix is a rotation, a stretch, and another rotation — the geometry behind everything in Act IV."
  - num: 17
    act: eigen
    title: "Low-rank approximation and PCA"
    short: "Part 17"
    permalink: /math/linear-algebra/low-rank-pca/
    blurb: "Keeping only the biggest singular values, and what PCA really does to a point cloud."
  - num: 18
    act: eigen
    title: "The complete picture of Ax = b"
    short: "Part 18"
    permalink: /math/linear-algebra/pseudoinverse/
    blurb: "One widget for every shape of Ax = b: unique, least-squares, least-norm, and the big picture that unifies them."
  - num: 19
    act: applied
    title: "Conditioning, stability, and cost"
    short: "Part 19"
    permalink: /math/linear-algebra/numerics/
    blurb: "Why a tiny change in b can move x a long way, and what each decomposition costs."
  - num: 20
    act: applied
    title: "Rotations, SO(3) and the exponential map"
    short: "Part 20"
    permalink: /math/linear-algebra/rotations/
    blurb: "Rotations as matrices, angle-axis and the exponential map, gimbal lock, and why quaternions exist."
  - num: 21
    act: applied
    title: "Jacobians, Hessians and Gauss–Newton"
    short: "Part 21"
    permalink: /math/linear-algebra/optimization/
    blurb: "Jacobians, Hessians and the Gauss–Newton step, with the sparsity pattern that makes pose graphs tractable."
  - num: 22
    act: applied
    title: "Linear algebra in ML and AI"
    short: "Part 22"
    permalink: /math/linear-algebra/ml-ai/
    blurb: "Attention as three matrices, and a low-rank update to a weight matrix — the linear algebra a transformer runs on."
appendix:
  - title: "Glossary and identities to know"
    short: "Reference"
    permalink: /math/linear-algebra/glossary/
    blurb: "Every term in the series linked back to where it is introduced, plus a cheat sheet of decompositions and identities."
