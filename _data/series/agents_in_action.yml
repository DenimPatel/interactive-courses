# One source of truth for the Agents in Action, Interactively guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html, and the
# series hub page's card grid. Part numbers live here only - page
# descriptions/titles must not restate them. The optional `acts:` list groups the
# pill nav under act labels (see _includes/series-nav.html); each part carries an
# `act:` key matching one of these ids. The glossary sits under a separate
# `appendix:` key so the linter's part-count check sees 19 parts, not 20.
#
# This file grows act by act: lint rule 5 requires every parts[].permalink to
# resolve to a page whose front-matter permalink matches exactly, so an entry can
# only be added once its page exists.
#
# Planned slugs (pages created under ai/agents-in-action/<slug>/):
#   I·agents    workflows-before-agents · tool-use · planning-family · mcp-and-code ·
#               memory-compaction · multi-agent · long-horizon
#   II·eval     error-analysis · datasets-and-ci · llm-judge · eval-rag-agents · observability
#   III·tuning  when-not-to-tune · tuning-in-practice
#   IV·production prompt-injection · defenses · reliability-cost · shipping
#   V·frontier  frontier
#   appendix    glossary
hub: /ai/agents-in-action/
title: Agents in Action, Interactively
acts:
  - id: agents
    label: "I · Agents"
  - id: eval
    label: "II · Evaluation"
  - id: tuning
    label: "III · Fine-tuning for products"
  - id: production
    label: "IV · Production"
  - id: frontier
    label: "V · Frontier"
parts:
  - num: 1
    act: agents
    title: "Workflows before agents"
    short: "Part 1"
    permalink: /ai/agents-in-action/workflows-before-agents/
    blurb: "The five workflow patterns, the complexity/value/viability/cost-of-error gate, and why most 'agents' should be workflows."
  - num: 2
    act: agents
    title: "Tool use: the loop, and tool design as the craft"
    short: "Part 2"
    permalink: /ai/agents-in-action/tool-use/
    blurb: "Schemas, tool_use/tool_result, parallel calls, and errors as data; few non-overlapping tools, token-efficient returns, and error messages written for the model."
  - num: 3
    act: agents
    title: "ReAct and the planning family"
    short: "Part 3"
    permalink: /ai/agents-in-action/planning-family/
    blurb: "ReAct, Plan-and-Execute, Reflexion, ToT and LATS — what survived to production, and why the ideas outlived the algorithms."
  - num: 4
    act: agents
    title: "MCP, skills, and code execution"
    short: "Part 4"
    permalink: /ai/agents-in-action/mcp-and-code/
    blurb: "The protocol and its stateless core; tool-definition bloat; SKILL.md's three loading stages; and why the context window is not a data bus."
  - num: 5
    act: agents
    title: "Memory and compaction"
    short: "Part 5"
    permalink: /ai/agents-in-action/memory-compaction/
    blurb: "Working, episodic, semantic and procedural memory; compaction versus context editing versus external notes; MemGPT/Letta, Mem0 and temporal graphs; compaction loss is adversarial."
  - num: 6
    act: agents
    title: "Multi-agent: the argument"
    short: "Part 6"
    permalink: /ai/agents-in-action/multi-agent/
    blurb: "Orchestrator-worker against single-thread; Anthropic's research system against Cognition's objection, and the read-heavy-and-independent versus shared-mutable-state reconciliation."
  - num: 7
    act: agents
    title: "Long-horizon agents and harness design"
    short: "Part 7"
    permalink: /ai/agents-in-action/long-horizon/
    blurb: "Context folding, step budgets, loop detection, sandboxing, permission gates, computer use, deep research as the composite case, and the harness as a source of variance."
  - num: 8
    act: eval
    title: "Why eval is the hard part, and error analysis"
    short: "Part 8"
    permalink: /ai/agents-in-action/error-analysis/
    blurb: "Look at your data; open and axial coding; the failure taxonomy and its Pareto chart; build your own trace viewer."
  - num: 9
    act: eval
    title: "Datasets, deterministic checks and CI"
    short: "Part 9"
    permalink: /ai/agents-in-action/datasets-and-ci/
    blurb: "Golden sets, coverage matrices, held-out test sets, code checks before judges, regression gating and significance."
  - num: 10
    act: eval
    title: "LLM-as-judge and its biases"
    short: "Part 10"
    permalink: /ai/agents-in-action/llm-judge/
    blurb: "Pointwise versus pairwise, rubrics from the taxonomy, position/verbosity/self-preference bias and its mitigation, validating the judge against humans, and IAA first."
  - num: 11
    act: eval
    title: "Evaluating RAG and agents"
    short: "Part 11"
    permalink: /ai/agents-in-action/eval-rag-agents/
    blurb: "Component-wise metrics, faithfulness and context precision/recall; end-state versus trajectory, pass^k, cost per completed task; SWE-bench Verified, τ²-bench, GAIA and OSWorld — and why public numbers don't transfer."
  - num: 12
    act: eval
    title: "Observability, online eval, and evals as the moat"
    short: "Part 12"
    permalink: /ai/agents-in-action/observability/
    blurb: "OTel GenAI semantics, logging retrieved context and prompt versions, A/B power, implicit signals, and cost and latency on the same dashboard."
  - num: 13
    act: tuning
    title: "When not to fine-tune"
    short: "Part 13"
    permalink: /ai/agents-in-action/when-not-to-tune/
    blurb: "The decision tree from prompt to RAG to eval to tune to RL; knowledge versus behaviour; the upgrade treadmill; your asset is the dataset, not the weights."
  - num: 14
    act: tuning
    title: "Data, distillation, and tuning in practice"
    short: "Part 14"
    permalink: /ai/agents-in-action/tuning-in-practice/
    blurb: "Curation, synthetic data and its diversity collapse, rejection sampling, LoRA/QLoRA operations, DPO/KTO/ORPO, RLVR and GRPO, reward hacking, and adapter serving."
  - num: 15
    act: production
    title: "Prompt injection and the lethal trifecta"
    short: "Part 15"
    permalink: /ai/agents-in-action/prompt-injection/
    blurb: "Direct versus indirect injection; private data, untrusted content and an exfiltration channel; why no system prompt fixes it."
  - num: 16
    act: production
    title: "Architectural defenses, guardrails and red-teaming"
    short: "Part 16"
    permalink: /ai/agents-in-action/defenses/
    blurb: "The six design patterns, capability-based information flow, dual-LLM; rails and classifiers as defence in depth; PII redaction before logging; GCG, PAIR and AgentDojo in CI."
  - num: 17
    act: production
    title: "Reliability, cost and latency engineering"
    short: "Part 17"
    permalink: /ai/agents-in-action/reliability-cost/
    blurb: "Timeouts, backoff, circuit breakers and degraded modes; the ordered cost-lever list; three cache layers and semantic caching's correctness cost; routing and when not to cascade; streaming and speculative UX."
  - num: 18
    act: production
    title: "Shipping probabilistic products"
    short: "Part 18"
    permalink: /ai/agents-in-action/shipping/
    blurb: "Prompts as versioned artifacts, canaries and rollback, risk-tiered autonomy, UX for uncertainty, and capturing user edits as signal."
  - num: 19
    act: frontier
    title: "The frontier, and what's unsolved"
    short: "Part 19"
    permalink: /ai/agents-in-action/frontier/
    blurb: "Multimodal and voice and the ~800 ms budget; the small-model/on-device shift; A2A/AP2/x402 and what protocols cannot express; reliability compounding; how to keep up without chasing."
appendix:
  - title: "Glossary and decision tables"
    short: "Reference"
    permalink: /ai/agents-in-action/glossary/
    blurb: "Every term in the volume linked back to the part that introduces it, plus the prompt to RAG to tune decision table, an eval-metric-per-failure-mode table, an injection-defense-pattern table, and a dated benchmark reference card."
