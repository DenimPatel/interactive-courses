# One source of truth for the Statistics, Interactively guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html, and the
# series hub page's card grid. Part numbers live here only - page
# descriptions/titles must not restate them. The optional `acts:` list groups the
# pill nav under act labels (see _includes/series-nav.html); each part carries an
# `act:` key matching one of these ids. The glossary sits under a separate
# `appendix:` key so the linter's part-count check sees 32 parts, not 33.
#
# This file grows act by act: lint rule 5 requires every parts[].permalink to
# resolve to a page whose front-matter permalink matches exactly, so an entry can
# only be added once its page exists.
hub: /math/statistics/
title: Statistics, Interactively
acts:
  - id: data
    label: "I · From data to distributions"
  - id: estimation
    label: "II · Estimation"
  - id: testing
    label: "III · Uncertainty & testing"
  - id: bayesian
    label: "IV · Bayesian inference"
  - id: learning
    label: "V · Statistics in ML"
  - id: time
    label: "VI · Estimation over time"
  - id: causal
    label: "VII · Causality & experiments"
parts:
  - num: 1
    act: data
    title: "What statistics actually asks"
    short: "Part 1"
    permalink: /math/statistics/inference-loop/
    blurb: "A hidden population, one sample, and an estimate that moves every time you redraw it while the truth stays put."
  - num: 2
    act: data
    title: "Describing one sample"
    short: "Part 2"
    permalink: /math/statistics/describing-data/
    blurb: "Histogram, KDE and ECDF of the same data, and how a single outlier pulls the mean away from the median."
  - num: 3
    act: data
    title: "Covariance, correlation, and the ellipse"
    short: "Part 3"
    permalink: /math/statistics/two-variables/
    blurb: "Two variables, one ellipse: drag the correlation and the points, and meet the four datasets with identical summaries."
  - num: 4
    act: data
    title: "The sampling distribution"
    short: "Part 4"
    permalink: /math/statistics/sampling-distribution/
    blurb: "Repeatedly draw a sample, drop its mean into a growing histogram, and watch the spread shrink as the sample grows."
  - num: 5
    act: data
    title: "The CLT you can feel"
    short: "Part 5"
    permalink: /math/statistics/clt-standard-error/
    blurb: "Convolve a draggable population with itself, and read the standard error off a curve instead of a formula."
  - num: 6
    act: estimation
    title: "Bias, variance, and mean squared error"
    short: "Part 6"
    permalink: /math/statistics/good-estimator/
    blurb: "Race three estimators of the same quantity across thousands of simulated samples, and split the error into the part that shrinks and the part that does not."
  - num: 7
    act: estimation
    title: "Maximum likelihood"
    short: "Part 7"
    permalink: /math/statistics/maximum-likelihood/
    blurb: "Data as ticks on an axis; drag the parameters over a live log-likelihood surface and watch the density slide onto the data."
  - num: 8
    act: estimation
    title: "Fisher information and the Cramér–Rao bound"
    short: "Part 8"
    permalink: /math/statistics/fisher-information/
    blurb: "The curvature of the log-likelihood is the error bar: zoom the peak, read off the width, and compare it to the best any estimator can do."
  - num: 9
    act: estimation
    title: "The bootstrap and the plug-in principle"
    short: "Part 9"
    permalink: /math/statistics/bootstrap/
    blurb: "Resample the data in front of you, build the bootstrap distribution, and get an interval without a formula."
  - num: 10
    act: estimation
    title: "Linear regression as estimation"
    short: "Part 10"
    permalink: /math/statistics/regression/
    blurb: "Drag points and watch the fit, its standard error, the residuals and the confidence band move together."
  - num: 11
    act: testing
    title: "What the 95% refers to"
    short: "Part 11"
    permalink: /math/statistics/confidence-intervals/
    blurb: "A hundred repeated experiments, a hundred intervals, and a count of how many miss. The interval is random; the parameter is not."
  - num: 12
    act: testing
    title: "Null distributions and the p-value"
    short: "Part 12"
    permalink: /math/statistics/hypothesis-testing/
    blurb: "Shuffle the labels, rebuild the null distribution, and shade the tail - a permutation test you can watch, with no formula required."
  - num: 13
    act: testing
    title: "Errors, power, and sample size"
    short: "Part 13"
    permalink: /math/statistics/power/
    blurb: "Two overlapping densities: drag the effect size, the sample size and the threshold, and watch the four outcomes trade against each other."
  - num: 14
    act: testing
    title: "p-hacking and the garden of forking paths"
    short: "Part 14"
    permalink: /math/statistics/multiple-comparisons/
    blurb: "A p-hacking sandbox: add covariates and subgroups until something is significant, then correct with Bonferroni or Benjamini-Hochberg."
  - num: 15
    act: testing
    title: "t, z, chi-square, F and the likelihood-ratio"
    short: "Part 15"
    permalink: /math/statistics/test-zoo/
    blurb: "One interactive reference: pick a question, and see which test, which null distribution and which assumption it needs."
  - num: 16
    act: bayesian
    title: "Prior × likelihood → posterior"
    short: "Part 16"
    permalink: /math/statistics/posterior/
    blurb: "Beta-Binomial inference: drag the prior, feed coin flips one at a time, and watch the data overwhelm it."
  - num: 17
    act: bayesian
    title: "Conjugacy and Gaussian fusion"
    short: "Part 17"
    permalink: /math/statistics/conjugacy-fusion/
    blurb: "Two Gaussians merging into a precision-weighted average - deliberately the seed of the Kalman filter."
  - num: 18
    act: bayesian
    title: "Credible intervals and decision theory"
    short: "Part 18"
    permalink: /math/statistics/credible-intervals/
    blurb: "Credible vs confidence side by side, and a loss function that decides whether the mean, the median or the mode is the number to report."
  - num: 19
    act: bayesian
    title: "When conjugacy fails: MCMC"
    short: "Part 19"
    permalink: /math/statistics/mcmc/
    blurb: "Live Metropolis-Hastings on a two-dimensional posterior: proposal width, trace plot, acceptance rate, burn-in and R-hat."
  - num: 20
    act: bayesian
    title: "Laplace and variational approximations"
    short: "Part 20"
    permalink: /math/statistics/variational/
    blurb: "Fit a Gaussian to a skewed posterior, and toggle KL(q‖p) against KL(p‖q) to see mode-seeking and mass-covering."
  - num: 21
    act: learning
    title: "The bias–variance decomposition"
    short: "Part 21"
    permalink: /math/statistics/bias-variance/
    blurb: "A polynomial-degree slider and an ensemble of fits over resampled data, drawing the bias and variance terms directly."
  - num: 22
    act: learning
    title: "Regularization is a prior"
    short: "Part 22"
    permalink: /math/statistics/regularization-prior/
    blurb: "Ridge is a Gaussian prior and lasso is a Laplace prior: watch the constraint region and the loss contours meet, and see MAP become penalised maximum likelihood."
  - num: 23
    act: learning
    title: "Cross-validation, AIC and BIC"
    short: "Part 23"
    permalink: /math/statistics/model-selection/
    blurb: "A k-fold animation, and the optimism of training error made visible as a gap that grows with capacity."
  - num: 24
    act: learning
    title: "Evaluation, ROC/PR, and calibration"
    short: "Part 24"
    permalink: /math/statistics/calibration/
    blurb: "One threshold slider driving the confusion matrix, the ROC point, the PR point and the reliability diagram together."
  - num: 25
    act: learning
    title: "Predictive uncertainty"
    short: "Part 25"
    permalink: /math/statistics/predictive-uncertainty/
    blurb: "Ensembles, MC dropout and split conformal prediction: the coverage guarantee demonstrated, then broken by distribution shift."
  - num: 26
    act: time
    title: "Gaussians in n dimensions"
    short: "Part 26"
    permalink: /math/statistics/multivariate-gaussian/
    blurb: "A draggable covariance, marginals on the margins and a conditioning slice: the multivariate Gaussian made geometric."
  - num: 27
    act: time
    title: "The Bayes filter"
    short: "Part 27"
    permalink: /math/statistics/bayes-filter/
    blurb: "A robot in a corridor: a histogram belief that blurs when it moves and multiplies when it sees a door."
  - num: 28
    act: time
    title: "The Kalman filter and the EKF"
    short: "Part 28"
    permalink: /math/statistics/kalman-filter/
    blurb: "Track in 2D with a live covariance ellipse, tune Q and R until it diverges, then linearise a range-bearing model and watch the EKF's error."
  - num: 29
    act: time
    title: "Particle filters and MCL"
    short: "Part 29"
    permalink: /math/statistics/particle-filter/
    blurb: "Particles over a map, systematic resampling, effective sample size, particle deprivation and the kidnapped-robot problem."
  - num: 30
    act: causal
    title: "Randomization, A/B tests, and peeking"
    short: "Part 30"
    permalink: /math/statistics/ab-testing/
    blurb: "A sequential-testing simulator: peek early and often, and watch the false-positive rate climb far past the level you chose."
  - num: 31
    act: causal
    title: "Confounding, Simpson's paradox, and DAGs"
    short: "Part 31"
    permalink: /math/statistics/confounding/
    blurb: "An interactive DAG: fork, chain and collider. Condition on a collider and watch a spurious correlation appear from nothing."
  - num: 32
    act: causal
    title: "Estimating causal effects"
    short: "Part 32"
    permalink: /math/statistics/causal-effects/
    blurb: "Potential outcomes on one simulated dataset: matching, inverse-probability weighting and difference-in-differences, and the estimate moving as you adjust."
appendix:
  - title: "Glossary, distribution table and cheat cards"
    short: "Reference"
    permalink: /math/statistics/glossary/
    blurb: "Every term in the series linked back to where it is introduced, plus the distribution table, a test-selection table and the estimator and interval formula card."