# One source of truth for the Nonlinear Optimization guide's part list.
hub: /vision/nonlinear-optimization/
title: Nonlinear Optimization, Interactively
parts:
  - num: 1
    title: "Gradient descent to Levenberg-Marquardt"
    short: "Part 1"
    permalink: /vision/nonlinear-optimization/gradient-descent/
    legacy: /nonlinear-optimization.html
    blurb: "Gradient descent, Newton's method, Gauss-Newton and Levenberg-Marquardt, built around one running example: a robot figuring out where it is."
  - num: 2
    title: "Optimization with rotations"
    short: "Part 2"
    permalink: /vision/nonlinear-optimization/rotations/
    legacy: /nonlinear-optimization-rotations.html
    blurb: "Extending the four methods to a robot's full 2D pose (x, y, heading) using range-and-bearing observations to landmarks."
  - num: 3
    title: "Unknown landmarks (SLAM)"
    short: "Part 3"
    permalink: /vision/nonlinear-optimization/slam/
    legacy: /nonlinear-optimization-slam.html
    blurb: "Landmarks are no longer known. The robot must jointly estimate its own pose and every landmark's position from observations alone."
  - num: 4
    title: "Pose graphs & loop closure"
    short: "Part 4"
    permalink: /vision/nonlinear-optimization/pose-graph/
    legacy: /nonlinear-optimization-pose-graph.html
    blurb: "Chaining many robot poses with noisy odometry, watching dead-reckoning drift accumulate, and how one loop closure corrects the whole trajectory."
  - num: 5
    title: "Rotations beyond a single angle"
    short: "Part 5"
    permalink: /vision/nonlinear-optimization/3d-rotations/
    legacy: /nonlinear-optimization-3d-rotations.html
    blurb: "Moving from a 2D heading to full 3D orientation, where rotations don't commute and can't simply be added."
appendix:
  - title: "SO(3) from scratch - the math behind 3D rotations"
    short: "Math primer"
    permalink: /vision/nonlinear-optimization/3d-rotations-math/
    legacy: /nonlinear-optimization-3d-rotations-math.html
    blurb: "Orthogonal matrices, skew-symmetric cross products, Rodrigues' formula, the matrix exponential, and the tangent-space perturbation that drives Gauss-Newton on a rotation."
