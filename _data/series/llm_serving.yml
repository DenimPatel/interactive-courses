# One source of truth for the LLM Serving guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html,
# and the series hub page's card grid. Note that the appendix lives under a
# separate `appendix:` key so the linter's part-count check sees 20 parts,
# not 21 (the appendix is a reference card, not a numbered part).
hub: /ai/llm-serving/
title: LLM Serving, Interactively
parts:
  - num: 1
    title: "The decode loop and the memory wall"
    short: "Part 1"
    permalink: /ai/llm-serving/decode-loop/
    blurb: "Why generating one token costs a full sweep of the weights through HBM, and why that single fact shapes everything that follows."
  - num: 2
    title: "The machine: HBM, interconnect and the accelerator zoo"
    short: "Part 2"
    permalink: /ai/llm-serving/hardware/
    blurb: "Bandwidth as the headline number, the all-reduce tax, NVL72 as one big GPU, SRAM architectures, and energy per token."
  - num: 3
    title: "TTFT, TPOT and goodput"
    short: "Part 3"
    permalink: /ai/llm-serving/metrics/
    blurb: "The four numbers that describe a serving system, why percentiles beat means, and how to write an SLO you can defend."
  - num: 4
    title: "The KV cache: sizing, GQA, MQA and MLA"
    short: "Part 4"
    permalink: /ai/llm-serving/kv-cache/
    blurb: "The bytes-per-token formula run against real model configs, and the lever it becomes for concurrency."
  - num: 5
    title: "PagedAttention: block tables, fragmentation and preemption"
    short: "Part 5"
    permalink: /ai/llm-serving/paged-memory/
    blurb: "The three kinds of waste in contiguous reservation, blocks and block tables, copy-on-write, and recompute versus swap."
  - num: 6
    title: "Continuous batching and chunked prefill"
    short: "Part 6"
    permalink: /ai/llm-serving/batching/
    blurb: "Why iteration-level batching wins, what batch size does to step time, and the ITL spike chunked prefill trades away."
  - num: 7
    title: "The scheduler: queues, fairness and admission control"
    short: "Part 7"
    permalink: /ai/llm-serving/scheduling/
    blurb: "What the scheduler decides every step, head-of-line blocking, length prediction, starvation, and when to shed load."
  - num: 8
    title: "Prefix caching, radix trees and the KV hierarchy"
    short: "Part 8"
    permalink: /ai/llm-serving/prefix-caching/
    blurb: "Reusing the same prefix across requests, RadixAttention, cache-aware routing, and the tier economics of fetch versus recompute."
  - num: 9
    title: "Inside the engine: kernels, CUDA graphs and the life of a request"
    short: "Part 9"
    permalink: /ai/llm-serving/engine/
    blurb: "The end-to-end request path, FlashAttention tiling, paged kernels, launch overhead, and the engine landscape."
  - num: 10
    title: "Quantization and numerics"
    short: "Part 10"
    permalink: /ai/llm-serving/quantization/
    blurb: "Formats from FP16 to MXFP4, activation outliers, why the win is bandwidth not FLOPs, and how to measure the damage."
  - num: 11
    title: "Speculative decoding"
    short: "Part 11"
    permalink: /ai/llm-serving/speculative/
    blurb: "Verify many, generate one; acceptance rates, draft models, tree attention, and why engines disable speculation under load."
  - num: 12
    title: "Parallelism for inference: TP, PP, EP, DP-attention, CP"
    short: "Part 12"
    permalink: /ai/llm-serving/parallelism/
    blurb: "Inference parallelism is not training parallelism, why TP stays inside NVLink, and how to search the sharding space."
  - num: 13
    title: "Prefill/decode disaggregation"
    short: "Part 13"
    permalink: /ai/llm-serving/disaggregation/
    blurb: "One pool, two jobs; sizing the pools, moving KV over RDMA, when disaggregation loses, and what DeepSeek actually runs."
  - num: 14
    title: "Serving mixture-of-experts at scale"
    short: "Part 14"
    permalink: /ai/llm-serving/moe/
    blurb: "Active versus total parameters, all-to-all dispatch, hot experts, EPLB, wide expert parallelism, and why rack-scale exists."
  - num: 15
    title: "Long-context serving"
    short: "Part 15"
    permalink: /ai/llm-serving/long-context/
    blurb: "Quadratic prefill, linear KV, ring attention, sparse attention and eviction, and the honest cost per request."
  - num: 16
    title: "Structured output and constrained decoding"
    short: "Part 16"
    permalink: /ai/llm-serving/structured-output/
    blurb: "Regex to FSM to per-state masks, why JSON needs a pushdown automaton, jump-forward decoding, and the constraint tax."
  - num: 17
    title: "LoRA, quotas and noisy neighbours"
    short: "Part 17"
    permalink: /ai/llm-serving/multi-tenancy/
    blurb: "One base and many adapters, batched LoRA kernels, adapter paging, token buckets, and fair queueing across tenants."
  - num: 18
    title: "Reasoning, agents and multimodal"
    short: "Part 18"
    permalink: /ai/llm-serving/workloads/
    blurb: "Workload shape as a first-class serving parameter: thinking-token budgets, agent turns, image tokens, and realtime voice."
  - num: 19
    title: "Kubernetes, autoscaling, cold starts and routing"
    short: "Part 19"
    permalink: /ai/llm-serving/cluster/
    blurb: "Gateways, routers and autoscalers; why GPU utilisation is a lie; the cold-start breakdown; and honest scale-to-zero."
  - num: 20
    title: "Benchmarking, cost and capacity planning"
    short: "Part 20"
    permalink: /ai/llm-serving/economics/
    blurb: "Open versus closed loop, batch non-invariance, dashboard signals, incident signatures, and RPS to GPUs to dollars."
appendix:
  - title: "Glossary & numbers to know"
    short: "Reference"
    permalink: /ai/llm-serving/glossary/
    blurb: "Every term in the series linked back to where it is introduced, plus the accelerator, model, quantization, engine and pricing tables."
