# One source of truth for the Probability, Interactively guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The optional `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these ids.
# `appendix:` (spelled `appendix:` below, matching the other series) holds the
# reference card so the linter's part-count check sees 20 parts, not 21.
hub: /math/probability/
title: Probability, Interactively
acts:
  - id: rules
    label: "I · The rules of chance"
  - id: variables
    label: "II · Random variables"
  - id: many
    label: "III · Many variables at once"
  - id: limits
    label: "IV · Limits and foundations"
parts:
  - num: 1
    act: rules
    title: "What a probability is"
    short: "Part 1"
    permalink: /math/probability/what-is-probability/
    blurb: "Relative frequency settling into a limit, a belief you can bet on, and the three axioms both pictures have to obey."
  - num: 2
    act: rules
    title: "Counting, and why it is the hard part"
    short: "Part 2"
    permalink: /math/probability/counting/
    blurb: "Permutations against combinations, the birthday problem, and the hash collisions that make counting a practical tool."
  - num: 3
    act: rules
    title: "Conditional probability"
    short: "Part 3"
    permalink: /math/probability/conditional/
    blurb: "Conditioning literally crops the sample space and renormalizes it — the unit square squeezed into a corner."
  - num: 4
    act: rules
    title: "Bayes' rule"
    short: "Part 4"
    permalink: /math/probability/bayes/
    blurb: "The medical test, natural frequencies, and the odds form that lets evidence accumulate one log at a time."
  - num: 5
    act: rules
    title: "Independence, and the paradoxes"
    short: "Part 5"
    permalink: /math/probability/independence/
    blurb: "Conditional independence, explaining-away in a three-node network, and Simpson's paradox in two draggable clouds."
  - num: 6
    act: variables
    title: "Random variables, PMFs and CDFs"
    short: "Part 6"
    permalink: /math/probability/random-variables/
    blurb: "One sample, three views: outcomes to PMF bars to a CDF staircase, with the highlighting linked across all three."
  - num: 7
    act: variables
    title: "Expectation"
    short: "Part 7"
    permalink: /math/probability/expectation/
    blurb: "The balance point of a distribution, why linearity survives dependence, LOTUS, and the indicator trick."
  - num: 8
    act: variables
    title: "Spread, moments and concentration"
    short: "Part 8"
    permalink: /math/probability/variance/
    blurb: "Variance as a moment of inertia, and Markov, Chebyshev and Hoeffding bounds drawn over the true tail."
  - num: 9
    act: variables
    title: "The discrete families"
    short: "Part 9"
    permalink: /math/probability/discrete-families/
    blurb: "Bernoulli, binomial, geometric, negative binomial and Poisson in one switchable panel, with the Poisson limit animated."
  - num: 10
    act: variables
    title: "From mass to density"
    short: "Part 10"
    permalink: /math/probability/densities/
    blurb: "Narrow the bins until a histogram becomes a pdf, and meet the trap that a density is not a probability."
  - num: 11
    act: variables
    title: "The continuous families and the Gaussian"
    short: "Part 11"
    permalink: /math/probability/continuous-families/
    blurb: "Uniform, exponential, gamma, beta and Student-t, and the Gaussian as the distribution entropy and the CLT both select."
  - num: 12
    act: variables
    title: "Transforming a random variable"
    short: "Part 12"
    permalink: /math/probability/transformations/
    blurb: "Push a density through a monotone map, watch it squash by the Jacobian, and sample by inverting the CDF."
  - num: 13
    act: many
    title: "Joint, marginal, conditional"
    short: "Part 13"
    permalink: /math/probability/joint/
    blurb: "A joint table with its marginals on the edges: slicing a row is conditioning, and independence is an outer product."
  - num: 14
    act: many
    title: "Covariance, correlation and Σ"
    short: "Part 14"
    permalink: /math/probability/covariance/
    blurb: "Drag a point cloud and read off the covariance matrix, the correlation, and the 1σ and 2σ ellipses it defines."
  - num: 15
    act: many
    title: "The multivariate Gaussian"
    short: "Part 15"
    permalink: /math/probability/multivariate-gaussian/
    blurb: "Eigen-decomposition as the ellipse axes, Mahalanobis distance, live conditioning, whitening, and a 3D surface."
  - num: 16
    act: many
    title: "Sums, convolution and generating functions"
    short: "Part 16"
    permalink: /math/probability/sums/
    blurb: "Slide one density across another to convolve them, and see why the Gaussian is stable while the Cauchy is not."
  - num: 17
    act: limits
    title: "The Law of Large Numbers"
    short: "Part 17"
    permalink: /math/probability/lln/
    blurb: "Many running averages at once, weak against strong, and the four modes of convergence as a map of counterexamples."
  - num: 18
    act: limits
    title: "The Central Limit Theorem"
    short: "Part 18"
    permalink: /math/probability/clt/
    blurb: "Pick a base distribution, slide n, and watch the sample mean become Gaussian — with the Berry–Esseen error readout."
  - num: 19
    act: limits
    title: "Tails, heavy tails, and high dimensions"
    short: "Part 19"
    permalink: /math/probability/tails/
    blurb: "Where the CLT fails: a Cauchy mean that never settles, Chernoff bounds, and concentration of measure in 100 dimensions."
  - num: 20
    act: limits
    title: "A measure-theoretic aside"
    short: "Part 20"
    permalink: /math/probability/measure/
    blurb: "Why not every set can have a probability, σ-algebras as the questions you may ask, filtrations, and Borel–Cantelli."
appendix:
  - title: "Glossary and distribution reference"
    short: "Glossary"
    permalink: /math/probability/glossary/
    blurb: "Every term in the volume linked back to the part that introduces it, plus a reference card of pmfs, pdfs, means, variances and mgfs."