# One source of truth for the Building with LLMs, Interactively guide's part list.
# Consumed by _includes/series-nav.html, _includes/series-prevnext.html, and the
# series hub page's card grid. Part numbers live here only - page
# descriptions/titles must not restate them. The optional `acts:` list groups the
# pill nav under act labels (see _includes/series-nav.html); each part carries an
# `act:` key matching one of these ids. The glossary sits under a separate
# `appendix:` key so the linter's part-count check sees 17 parts, not 18.
#
# This file grows act by act: lint rule 5 requires every parts[].permalink to
# resolve to a page whose front-matter permalink matches exactly, so an entry can
# only be added once its page exists.
#
# Planned slugs (pages created under ai/building-with-llms/<slug>/):
#   I·model    stateless-function · tokens-and-budgets · sampling · cost-latency · first-eval
#   II·context instructions-and-roles · few-shot · reasoning · structured-output ·
#              context-engineering · caching-layout
#   III·retrieval why-retrieve · embeddings · chunking · ann-index · hybrid-rerank ·
#              beyond-chunks
#   appendix   glossary
hub: /ai/building-with-llms/
title: Building with LLMs, Interactively
acts:
  - id: model
    label: "I · The model as a component"
  - id: context
    label: "II · Prompting and context design"
  - id: retrieval
    label: "III · Retrieval"
parts:
  - num: 1
    act: model
    title: "What you're actually building on"
    short: "Part 1"
    permalink: /ai/building-with-llms/stateless-function/
    blurb: "The model is a stateless text function; every 'memory' is your code resending text, and the context window is the budget that governs it."
  - num: 2
    act: model
    title: "Tokens, windows and budgets"
    short: "Part 2"
    permalink: /ai/building-with-llms/tokens-and-budgets/
    blurb: "Byte-pair encoding, why a token is not a word, per-family tokenizers, and the context window as a contested budget."
  - num: 3
    act: model
    title: "Sampling, nondeterminism and confidence"
    short: "Part 3"
    permalink: /ai/building-with-llms/sampling/
    blurb: "Temperature, top-p and top-k; why temperature 0 is not deterministic; logprobs and the poor calibration of post-RLHF models."
  - num: 4
    act: model
    title: "Cost and latency from first principles"
    short: "Part 4"
    permalink: /ai/building-with-llms/cost-latency/
    blurb: "The input/output price asymmetry, TTFT versus TPOT, why an agent loop is quadratic in turns, and effort as a dial."
  - num: 5
    act: model
    title: "Your first eval, in twenty lines"
    short: "Part 5"
    permalink: /ai/building-with-llms/first-eval/
    blurb: "Five examples, a binary check, a pass rate — deliberately early, so every later part is measurable."
  - num: 6
    act: context
    title: "Instructions, roles and the right altitude"
    short: "Part 6"
    permalink: /ai/building-with-llms/instructions-and-roles/
    blurb: "System prompts, delimiters, and data/instruction separation — the first security lesson."
  - num: 7
    act: context
    title: "Few-shot: examples as specification"
    short: "Part 7"
    permalink: /ai/building-with-llms/few-shot/
    blurb: "Selection, ordering, and format contagion: the model copies your examples' mistakes."
  - num: 8
    act: context
    title: "Reasoning: CoT, self-consistency, and what reasoning models changed"
    short: "Part 8"
    permalink: /ai/building-with-llms/reasoning/
    blurb: "Wei et al. and Kojima et al. as history; self-consistency as the first test-time-compute pattern; why prescriptive CoT now often hurts."
  - num: 9
    act: context
    title: "Structured output and constrained decoding"
    short: "Part 9"
    permalink: /ai/building-with-llms/structured-output/
    blurb: "JSON Schema, strict tools, and grammar/FSM token masking; syntax guarantees are not semantic ones."
  - num: 10
    act: context
    title: "Context engineering"
    short: "Part 10"
    permalink: /ai/building-with-llms/context-engineering/
    blurb: "Write, select, compress, isolate; compaction, JIT retrieval, structured notes; context rot and lost-in-the-middle; long context versus retrieval."
  - num: 11
    act: context
    title: "Caching-aware prompt layout"
    short: "Part 11"
    permalink: /ai/building-with-llms/caching-layout/
    blurb: "Prefix matching, stable-content-first ordering, breakpoints, silent invalidators, and measuring cache_read_input_tokens."
  - num: 12
    act: retrieval
    title: "Why retrieve, and lexical search first"
    short: "Part 12"
    permalink: /ai/building-with-llms/why-retrieve/
    blurb: "Freshness, privacy, citations, ACLs and cost — not 'the model doesn't know things'; BM25 as the brutally strong baseline."
  - num: 13
    act: retrieval
    title: "Embeddings and vector similarity"
    short: "Part 13"
    permalink: /ai/building-with-llms/embeddings/
    blurb: "What a vector means, cosine versus relevance, query/document asymmetry, Matryoshka truncation, and MTEB's overfitting problem."
  - num: 14
    act: retrieval
    title: "Chunking, and contextual retrieval"
    short: "Part 14"
    permalink: /ai/building-with-llms/chunking/
    blurb: "Fixed, recursive, semantic, parent-doc and RAPTOR chunking; boundary effects; and contextual retrieval's measured failure reductions."
  - num: 15
    act: retrieval
    title: "Approximate nearest neighbour"
    short: "Part 15"
    permalink: /ai/building-with-llms/ann-index/
    blurb: "Flat, IVF, PQ, HNSW, ScaNN and DiskANN; recall, QPS and memory as a four-way tradeoff; and why filtered ANN is genuinely hard."
  - num: 16
    act: retrieval
    title: "Hybrid search, fusion and reranking"
    short: "Part 16"
    permalink: /ai/building-with-llms/hybrid-rerank/
    blurb: "RRF versus score normalisation, SPLADE, cross-encoders and late interaction; retrieve wide, rerank narrow."
  - num: 17
    act: retrieval
    title: "Beyond chunks: query transforms, graph, multimodal, code — and the “RAG is dead” debate"
    short: "Part 17"
    permalink: /ai/building-with-llms/beyond-chunks/
    blurb: "HyDE, multi-query and step-back; Self-RAG and CRAG; GraphRAG's global questions; ColPali; grep versus embeddings for code; and the long-context argument as an argument."
appendix:
  - title: "Glossary and selection tables"
    short: "Reference"
    permalink: /ai/building-with-llms/glossary/
    blurb: "Every term in the volume linked back to the part that introduces it, plus a retrieval-architecture selection table and a RAG failure-mode to metric table."
