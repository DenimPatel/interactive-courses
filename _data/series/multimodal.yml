# One source of truth for the Multimodal Models guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these
# ids, added by hand because scripts/new-part.sh does not emit it.
# `appendix:` holds the glossary so the linter's part-count check sees the real
# part count, not part count + 1 (an appendix is a reference card, not a part).
hub: /ai/multimodal/
title: Multimodal Models, Interactively
acts:
  - id: seeing
    label: "I · Seeing"
  - id: gluing
    label: "II · Gluing vision to a language model"
  - id: trunk
    label: "III · One trunk, many modalities"
  - id: beyond
    label: "IV · Beyond text out"
parts:
  - num: 1
    act: seeing
    title: "Pixels into tokens"
    short: "Part 1"
    permalink: /ai/multimodal/vit/
    blurb: "Patching an image into a sequence, position embeddings and the class token, and what a vision transformer gives up against a convolution."
  - num: 2
    act: seeing
    title: "Caption matches picture"
    short: "Part 2"
    permalink: /ai/multimodal/contrastive/
    blurb: "InfoNCE on the similarity matrix, the temperature and batch size it needs, and SigLIP's pairwise sigmoid alternative."
  - num: 3
    act: seeing
    title: "What a shared space buys"
    short: "Part 3"
    permalink: /ai/multimodal/shared-embedding-space/
    blurb: "Zero-shot classification, retrieval and prompt templates, and the compositionality, counting and typographic failures the space inherits."
  - num: 4
    act: seeing
    title: "The modality zoo"
    short: "Part 4"
    permalink: /ai/multimodal/modalities/
    blurb: "Audio, video and 3D encoders aligned into one space, what a hub modality binds, and what aligned does and does not mean."
  - num: 5
    act: gluing
    title: "Bolting an encoder onto a language model"
    short: "Part 5"
    permalink: /ai/multimodal/adapters/
    blurb: "Linear and MLP projectors, the Q-Former and cross-attention bridges, where image tokens sit, and what each option trains."
  - num: 6
    act: gluing
    title: "Resolution and the token budget"
    short: "Part 6"
    permalink: /ai/multimodal/resolution/
    blurb: "Fixed patches, AnyRes tiling and native dynamic resolution, the merge that compresses tokens, and the image's prefill cost."
  - num: 7
    act: gluing
    title: "Training a vision-language model"
    short: "Part 7"
    permalink: /ai/multimodal/training-a-vlm/
    blurb: "The staged recipe, freezing schedules and data mixtures, what breaks along the way, and preference tuning on multimodal pairs."
  - num: 8
    act: gluing
    title: "Why VLMs hallucinate"
    short: "Part 8"
    permalink: /ai/multimodal/hallucination-and-evals/
    blurb: "Objects that were never there, attention sinks on image tokens, the language prior overriding pixels, and the benchmarks that measure it."
  - num: 9
    act: trunk
    title: "One trunk, many modalities"
    short: "Part 9"
    permalink: /ai/multimodal/early-fusion/
    blurb: "Dropping the bridge between towers, native multimodal pretraining, modality embedders into one stream, and modality-aware experts."
  - num: 10
    act: trunk
    title: "Video in, long context"
    short: "Part 10"
    permalink: /ai/multimodal/video-in/
    blurb: "Frame sampling against a token budget, temporal position encoding, streaming memory, and the KV arithmetic a clip implies."
  - num: 11
    act: trunk
    title: "Listening models"
    short: "Part 11"
    permalink: /ai/multimodal/audio-in/
    blurb: "Speech as an encoder's output or as native audio tokens in the trunk, speech instruction following, and paralinguistics."
  - num: 12
    act: trunk
    title: "Omni models and the real-time loop"
    short: "Part 12"
    permalink: /ai/multimodal/omni/
    blurb: "Interleaved token streams, the thinker-and-talker split, listening while speaking, barge-in, and the realtime budget."
  - num: 13
    act: beyond
    title: "Understanding and generating"
    short: "Part 13"
    permalink: /ai/multimodal/unified-models/
    blurb: "One model that reads and makes images, the tokenizer choice that decides whether it works, and three generation orders."
  - num: 14
    act: beyond
    title: "Grounding"
    short: "Part 14"
    permalink: /ai/multimodal/grounding/
    blurb: "Detection and segmentation as coordinate tokens, promptable segmentation, referring expressions, and grounding an interface."
  - num: 15
    act: beyond
    title: "Vision-language-action"
    short: "Part 15"
    permalink: /ai/multimodal/vla/
    blurb: "Actions as text tokens, a flow-matching action expert, chunking, and the latent world models that predict what happens next."
  - num: 16
    act: beyond
    title: "Serving and evaluating multimodal systems"
    short: "Part 16"
    permalink: /ai/multimodal/serving-and-open-problems/
    blurb: "Encoder disaggregation and caching, the prefill-and-decode inversion an image causes, safety, and the open problems."
appendix:
  - title: "Glossary & numbers to know"
    short: "Reference"
    permalink: /ai/multimodal/glossary/
    blurb: "Every term linked back to the part that introduces it, plus the architecture-era, token-budget and evaluation tables."
