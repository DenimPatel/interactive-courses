# The guide subjects in this repo. Drives the global nav (_includes/site-nav.html),
# the homepage doors, and each section hub page (_layouts/section-hub.html).
#
# Contract - one entry per section, keys:
#   id        (required) matches page front-matter `section:` values for this subject.
#   title     (required) the section's display name.
#   url       (required) the section hub's own permalink.
#   kicker    (required) short label shown above the h1 on the hub.
#   blurb     (required) the hub's lede paragraph.
#   series    (required) a list of series ids (matching _data/series/<id>.yml
#             filenames) to render as card grids, each followed by an
#             "Open the N-part guide" button.
#
# This repo (interactive-courses) holds guides only. The record pages, field
# notes and the blog live in the companion repo, https://denimpatel.github.io/AI/.
- id: ai
  title: "AI"
  url: /ai/
  kicker: "Interactive guides"
  blurb: "Six interactive guides to how a language model is trained, how one is served at scale, how to build with LLMs, how agents act in the world, and how models are made to see, hear and generate media."
  series:
    - llm_training
    - llm_serving
    - building_with_llms
    - agents_in_action
    - generative_media
    - multimodal

- id: vision
  title: "Vision & Geometry"
  url: /vision/
  kicker: "Interactive guides"
  blurb: "Three long interactive guides built around running examples you can drag: the geometry that turns images into 3D structure, the nonlinear least-squares machinery that makes it converge, and the Lie groups and Lie algebras that let rotations and poses be estimated at all."
  series:
    - multi_view_geometry
    - nonlinear_optimization
    - lie_theory
    - guide_kit_demo

- id: math
  title: "Math"
  url: /math/
  kicker: "Foundations"
  blurb: "The machinery every other subject assumes, built from pictures first: a 22-part interactive guide to linear algebra, two interactive calculus volumes that build single- and multivariable calculus from local linearity up to the gradients, Jacobians, backprop and Lie-group updates the AI and vision guides consume, two interactive probability volumes that go from what a probability means to the filters, samplers and estimators those guides run on, and an interactive guide to statistics that starts at a sample you can redraw and ends at Kalman filters and causal inference."
  series:
    - linear_algebra
    - calculus
    - calculus_in_motion
    - probability
    - probability_in_action
    - statistics
